services:

  # Always-on HTTP API server — hosts the scheduler and serves the state files.
  # Exposed via Cloudflare tunnel at trade.praguefun.cz.
  api:
    build: .
    entrypoint: ["uv", "run", "uvicorn", "titantrade.api:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./state:/app/state
      - ./logs:/app/logs
    restart: unless-stopped

  # Cloudflare tunnel — routes trade.praguefun.cz → api:8000.
  # CLOUDFLARE_TUNNEL_TOKEN must be set in .env.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - api

  # CLI runner — one-off commands (fetch, signals, execute, curate, backtest-mech).
  # Usage: docker compose run --rm titantrade <command>
  titantrade:
    build: .
    env_file: .env
    volumes:
      - ./state:/app/state
      - ./logs:/app/logs
