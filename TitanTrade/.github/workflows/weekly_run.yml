name: Weekly Analyst

on:
  schedule:
    # Every Sunday at 20:00 UTC
    - cron: "0 20 * * 0"
  workflow_dispatch: # Allow manual trigger

jobs:
  weekly-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Run weekly analyst
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          FMP_KEY: ${{ secrets.FMP_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          CLAUDE_KEY: ${{ secrets.CLAUDE_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: uv run python -m titantrade.weekly_analyst

      - name: Commit state changes
        run: |
          git config user.name "TitanTrade Bot"
          git config user.email "bot@titantrade.dev"
          git add state/ logs/
          git commit -m "Weekly analysis: $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
          git push
