[project]
name = "titantrade"
version = "0.1.0"
description = "Semi-automated AI-powered trading system with dual-AI architecture"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.52.0",
    "apscheduler>=3.10,<4",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.1.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
dev = [
    "ruff>=0.6",
    "vulture>=2.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/titantrade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
